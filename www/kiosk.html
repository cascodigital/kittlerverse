<meta charset="utf-8">
<title>KITTLERVERSE — Ops Board</title>
<style>
  :root{
    --void:#05070f; --ink:#e8ecf5; --dim:#aab4c8;
    --cyan:#6ee7ff; --orange:#ff9e64; --violet:#b58cff; --green:#5eea8d; --red:#ff6b6b;
  }
  html,body{height:100%}
  body{margin:0;background:var(--void);color:var(--ink);overflow:hidden;
       font-family:ui-monospace,'Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace}

  /* starfield — two box-shadow layers, opacity keyframes only (compositor-cheap) */
  .stars{position:fixed;inset:0;pointer-events:none}
  .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:transparent}
  #st1{animation:tw 7s ease-in-out infinite}
  #st2{animation:tw 11s ease-in-out infinite reverse}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:.75}}
  .vign{position:fixed;inset:0;pointer-events:none;
        background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(0,0,0,.55))}

  /* header */
  header{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;
         padding:18px 30px 6px;height:118px;box-sizing:border-box}
  h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.35em;
     text-shadow:0 0 18px rgba(110,231,255,.5)}
  h1 b{color:var(--cyan);font-weight:700}
  #sub{margin:6px 0 0;font-size:12px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
  #hdr-r{text-align:right;font-size:12px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;line-height:1.7}
  #clock{font-size:36px;letter-spacing:.08em;color:var(--ink);text-shadow:0 0 14px rgba(232,236,245,.35)}
  #upline .n{color:var(--green);font-size:24px;text-shadow:0 0 14px rgba(94,234,141,.6)}
  #upline.warn .n{color:var(--red);text-shadow:0 0 14px rgba(255,107,107,.6)}
  #live{color:var(--green)}
  #live::before{content:'● ';animation:pulse 3s ease-in-out infinite;display:inline-block}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* two lobes side by side — one docker host each */
  #board{position:relative;z-index:2;display:grid;gap:10px 16px;
         padding:4px 30px 10px;height:calc(100vh - 126px);box-sizing:border-box;
         grid-template-rows:minmax(0,1fr) 92px}
  #lobes{display:grid;gap:16px;min-height:0}
  .lobe{display:grid;grid-template-rows:26px minmax(0,1fr);gap:8px;min-height:0}
  .lobehd{display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.24em;
          text-transform:uppercase;color:var(--dim);border-bottom:1px solid rgba(125,135,156,.22);
          padding-bottom:5px}
  .lobehd .glyph{font-size:18px;font-weight:700}
  .lobehd .tot{margin-left:auto;color:var(--ink);letter-spacing:.1em}
  .lobehd.dark{color:var(--red);border-color:rgba(255,107,107,.5);animation:pulse 1.6s ease-in-out infinite}
  .cards{display:grid;gap:8px;grid-auto-rows:minmax(0,1fr);min-height:0}

  .card{position:relative;border:1px solid rgba(125,135,156,.22);background:rgba(10,15,30,.82);
        padding:7px 14px 6px;overflow:hidden;min-height:0;display:flex;flex-direction:column;justify-content:space-between;
        transition:transform .9s cubic-bezier(.2,.8,.2,1),border-color .9s,box-shadow .9s,background .9s;
        will-change:transform}
  .card>div:first-child{min-height:0;overflow:hidden}
  .card>div:last-child{flex:none}
  .card .top{display:flex;align-items:center;gap:10px}
  .sun{width:14px;height:14px;border-radius:50%;flex:none;
       animation:sunpulse 4s ease-in-out infinite;will-change:transform,opacity}
  @keyframes sunpulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.18);opacity:1}}
  .card h2{margin:0;font-size:15px;letter-spacing:.18em;font-weight:700}
  .card .mid{font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-left:auto}
  .card .mid b{color:var(--ink);font-weight:400}
  .blist{margin-top:4px;font-size:12px;letter-spacing:.02em;line-height:1.55;color:var(--ink);
         columns:2;column-gap:16px;overflow:hidden}
  .blist.c3{columns:3}
  .blist.c4{columns:4}
  .blist div{break-inside:avoid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .blist .ok{color:var(--green)}
  .blist .bad{color:var(--red);animation:pulse 1.6s ease-in-out infinite}
  .blist .zz{color:var(--dim);opacity:.6}
  .blist .mb{color:var(--dim);float:right;font-size:10.5px}
  .cpu{height:4px;background:rgba(125,135,156,.18);margin-top:4px;overflow:hidden}
  .cpu i{display:block;height:100%;width:0%;transition:width 1.4s ease;box-shadow:0 0 8px currentColor;background:currentColor}
  .foot{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.12em;
        color:var(--dim);text-transform:uppercase;margin-top:4px}
  .card.spot{transform:scale(1.02);background:rgba(10,16,32,.85);z-index:3}
  .card.alert{border-color:rgba(255,107,107,.65);animation:alarmglow 2.2s ease-in-out infinite}
  @keyframes alarmglow{0%,100%{box-shadow:0 0 10px rgba(255,107,107,.15)}50%{box-shadow:0 0 26px rgba(255,107,107,.5)}}
  .card.alert .mid{margin-right:76px}
  .badge{position:absolute;top:6px;right:10px;font-size:10.5px;letter-spacing:.25em;color:var(--red);
         text-transform:uppercase;animation:pulse 1.6s ease-in-out infinite}

  /* row dossier strips */
  #strips{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;min-height:0}
  .rowstrip{display:flex;align-items:center;gap:14px;box-sizing:border-box;min-height:0;overflow:hidden;
            padding:9px 16px;border:1px solid rgba(110,231,255,.14);background:rgba(6,9,18,.72)}
  .rowstrip .dot{width:11px;height:11px;border-radius:50%;flex:none;animation:sunpulse 3s ease-in-out infinite}
  .rowstrip .dos{opacity:1;transition:opacity .6s ease;min-width:0}
  .rowstrip .dos.fade{opacity:0}
  .rowstrip .nm{font-size:15px;letter-spacing:.08em;color:var(--cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rowstrip .nm em{font-style:normal;color:var(--dim);font-size:11px;letter-spacing:.22em;text-transform:uppercase;margin-left:12px}
  .rowstrip .ds{font-size:12px;color:var(--ink);margin-top:3px;line-height:1.35;overflow:hidden;
                display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .rowstrip .st{font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:3px;color:var(--green)}
  .rowstrip .st.bad{color:var(--red)}
</style>
<div class="stars"><i id="st1"></i><i id="st2"></i></div>
<div class="vign"></div>
<header>
  <div>
    <h1>KITTLER<b>VERSE</b></h1>
    <p id="sub">OPS BOARD · SCANNING…</p>
  </div>
  <div id="hdr-r">
    <div id="clock">--:--:--</div>
    <div id="upline"><span class="n" id="nup">–</span> UP · <span id="ndown">–</span> DOWN · <span id="nram">–</span> MB</div>
    <div id="live">LIVE TELEMETRY <span id="sync"></span></div>
  </div>
</header>
<div id="board">
  <div id="lobes"></div>
  <div id="strips"></div>
</div>
<script>
'use strict';
/* Ops Board — DOM + CSS only, zero canvas. Everything it knows comes from
   telemetry.json (what exists, on which host) and lore.json (what to call it).
   The inventory is NEVER hardcoded here: this file used to keep a hand-copied
   duplicate of the galaxy's catalogue and it silently rotted for three weeks. */

/* ---- starfield: generate box-shadows once ---- */
function stars(el,n,size){
  const s=[];for(let i=0;i<n;i++)
    s.push(`${(Math.random()*100).toFixed(2)}vw ${(Math.random()*100).toFixed(2)}vh 0 ${size}px rgba(232,236,245,${(.2+Math.random()*.6).toFixed(2)})`);
  el.style.boxShadow=s.join(',');
}
stars(document.getElementById('st1'),110,0);
stars(document.getElementById('st2'),70,.5);

let LORE={systems:[],bodies:{},moons:{},prefixes:[],hosts:[]};
let SYSTEMS=[];            // [{id,host,sys,name,color,lore,keys:[planet names]}]
let SYS={},hostStatus=[];
const cards={},strips=[];
let worldKey='';

function bodyLore(name){
  const e=LORE.bodies[name];
  if(e)return {sys:e.sys,desc:e.desc,dormant:!!e.dormant,label:name};
  for(const p of (LORE.prefixes||[]))
    if(name.startsWith(p.match))return {sys:p.sys,desc:p.desc,dormant:!!p.dormant,label:p.name};
  return null;
}
function starMeta(name){
  return LORE.systems.find(s=>s.name===name)||{name,color:'#9aa7ff',lore:'Not on any chart yet.'};
}
function hostMeta(id){
  return (LORE.hosts||[]).find(h=>h.id===id)||{id,glyph:'?',label:id.toUpperCase()};
}

/* group telemetry into host → system → planet, exactly like the galaxy does */
function group(containers){
  const g=new Map(),hosts=[];
  for(const c of containers){
    const host=c.host||'46';
    if(!hosts.includes(host))hosts.push(host);
    const L=bodyLore(c.name);
    const sys=L?L.sys:'UNCHARTED',key=L?L.label:c.name;
    const sid=host+'|'+sys;
    let s=g.get(sid);
    if(!s){s={id:sid,host,sys,planets:new Map()};g.set(sid,s);}
    let p=s.planets.get(key);
    if(!p){p={key,desc:L?L.desc:'Not on the charts — add it to lore.json.',dormant:!!(L&&L.dormant),members:[]};s.planets.set(key,p);}
    p.members.push(c);
  }
  return {groups:g,hosts};
}

/* rebuild the DOM only when the structure actually changes */
function rebuild(groups,hosts){
  const spread={};
  for(const s of groups.values()){(spread[s.sys]=spread[s.sys]||new Set()).add(s.host);}
  SYSTEMS=[...groups.values()].sort((a,b)=>a.id<b.id?-1:1).map(s=>{
    const meta=starMeta(s.sys);
    return {id:s.id,host:s.host,sys:s.sys,color:meta.color,lore:meta.lore,
            name:s.sys+(spread[s.sys].size>1?' · '+s.host:''),
            keys:[...s.planets.keys()].sort()};
  });
  const lobes=document.getElementById('lobes');
  lobes.innerHTML='';
  // a host with 10 systems needs more wall than a host with 6: give each lobe
  // as many sub-columns as it takes to keep ~5 cards per column, and weight the
  // lobe's width by that. Otherwise the busy host clips and the quiet one wastes space.
  const colsOf={};
  for(const hid of hosts)colsOf[hid]=Math.max(1,Math.ceil(SYSTEMS.filter(s=>s.host===hid).length/5));
  lobes.style.gridTemplateColumns=hosts.map(h=>colsOf[h]+'fr').join(' ');
  for(const hid of hosts){
    const hm=hostMeta(hid);
    const lobe=document.createElement('div');lobe.className='lobe';
    lobe.innerHTML=`<div class="lobehd" data-host="${hid}">
        <span class="glyph">${hm.glyph}</span><span>${hm.label}</span>
        <span class="tot" data-tot="${hid}">–</span></div>
      <div class="cards"></div>`;
    const box=lobe.querySelector('.cards');
    box.style.gridTemplateColumns='repeat('+colsOf[hid]+',1fr)';
    for(const s of SYSTEMS.filter(x=>x.host===hid)){
      const el=document.createElement('div');el.className='card';
      const cols=s.keys.length>12?'c4':s.keys.length>6?'c3':'';
      el.innerHTML=`<div><div class="top">
          <span class="sun" style="background:${s.color};box-shadow:0 0 14px ${s.color},0 0 32px ${s.color}55"></span>
          <h2 style="color:${s.color}">${s.sys}</h2>
          <div class="mid"><b class="up">–</b>/<span class="tot">–</span> · <b class="ram">–</b> MB</div></div>
          <div class="blist ${cols}"></div></div>
        <div><div class="cpu"><i style="color:${s.color}"></i></div>
        <div class="foot"><span class="cpuv">CPU –%</span><span class="topc"></span></div></div>
        <span class="badge" style="display:none">✹ ALERT</span>`;
      box.appendChild(el);cards[s.id]=el;
    }
    lobes.appendChild(lobe);
  }
  const sbox=document.getElementById('strips');
  if(!strips.length){
    for(let c=0;c<3;c++){
      const st=document.createElement('div');st.className='rowstrip';
      st.innerHTML=`<div class="dot"></div><div class="dos">
        <div class="nm">SCANNING…</div><div class="ds"></div><div class="st"></div></div>`;
      sbox.appendChild(st);strips.push(st);
    }
  }
  document.getElementById('sub').textContent='OPS BOARD · '+SYSTEMS.length+' STAR SYSTEMS · '
    +hosts.map(h=>hostMeta(h).label.split(' · ')[0]).join(' + ');
}

/* ---- telemetry ---- */
const NAVG=5;
let HIST={};try{HIST=JSON.parse(localStorage.getItem('kv_hist')||'{}');}catch(e){}
function pushHist(name,cpu){
  const h=HIST[name]||(HIST[name]=[]);
  h.push(cpu);while(h.length>NAVG)h.shift();
  return h.reduce((a,b)=>a+b,0)/h.length;
}

function applyLive(data){
  hostStatus=Array.isArray(data.hosts)?data.hosts:[];
  const {groups,hosts}=group(data.containers);
  const wk=[...groups.keys()].sort().join('|')+'#'+
    [...groups.values()].map(s=>s.id+':'+[...s.planets.keys()].sort().join(',')).sort().join('|');
  if(wk!==worldKey){worldKey=wk;rebuild(groups,hosts);}

  const per={},hostTot={};
  for(const s of SYSTEMS)per[s.id]={up:0,tot:0,ram:0,cpu:0,cpuavg:0,alerts:[],live:{}};
  let up=0,down=0,ram=0;
  for(const s of groups.values()){
    const p=per[s.id];if(!p)continue;
    const ht=hostTot[s.host]=hostTot[s.host]||{up:0,tot:0,ram:0};
    for(const pl of s.planets.values()){
      let pmem=0,pcpu=0,running=true,bad=false,reason='',status='';
      for(const c of pl.members){
        if(c.state==='running')up++;else down++;
        ram+=c.mem;ht.ram+=c.mem;ht.tot++;
        if(c.state==='running')ht.up++;
        pmem+=c.mem;pcpu+=c.cpu;status=status||c.status;
        if(c.state!=='running')running=false;
        if(c.alert&&c.alert!=='ok'&&!pl.dormant){bad=true;reason=reason||c.reason||c.alert;}
        // legendas is dormant but MUST run daily — silence for 24h+ is an alert
        if(pl.key==='legendas'&&c.state!=='running'){
          const m=(c.status||'').match(/(\d+)\s+(hour|day|week|month)s?\s+ago/i);
          if(m&&(m[2].toLowerCase()!=='hour'||+m[1]>=24)){bad=true;reason='sem rodar há '+m[1]+' '+m[2]+'(s)';}
        }
      }
      p.tot++;p.ram+=pmem;p.cpu+=pcpu;if(running)p.up++;
      const avg=pushHist(s.host+'|'+pl.key,pcpu);p.cpuavg+=avg;
      if(bad)p.alerts.push(pl.key+': '+reason);
      p.live[pl.key]={cpu:pcpu,avg,mem:pmem,status,running,bad,dormant:pl.dormant,
                      desc:pl.desc,count:pl.members.length};
    }
  }
  try{localStorage.setItem('kv_hist',JSON.stringify(HIST));}catch(e){}

  // a host the poller cannot reach is the loudest alert on the board
  for(const hs of hostStatus){
    const hd=document.querySelector('.lobehd[data-host="'+hs.id+'"]');
    if(hd)hd.classList.toggle('dark',!hs.reachable);
  }
  for(const [hid,t] of Object.entries(hostTot)){
    const el=document.querySelector('[data-tot="'+hid+'"]');
    const hs=hostStatus.find(h=>h.id===hid);
    if(el)el.textContent=(hs&&!hs.reachable)?'DARK — POLLER CANNOT REACH':
      t.up+'/'+t.tot+' up · '+t.ram.toFixed(0)+' MB';
  }
  const dark=hostStatus.filter(h=>!h.reachable).length;
  document.getElementById('nup').textContent=up;
  document.getElementById('ndown').textContent=down;
  document.getElementById('nram').textContent=ram.toFixed(0);
  document.getElementById('upline').classList.toggle('warn',down>3||dark>0);
  document.getElementById('sync').textContent='· '+new Date(data.ts).toLocaleTimeString();

  for(const s of SYSTEMS){
    const p=per[s.id],el=cards[s.id];if(!el)continue;
    el.querySelector('.up').textContent=p.up;
    el.querySelector('.tot').textContent=p.tot;
    el.querySelector('.ram').textContent=p.ram.toFixed(0);
    el.querySelector('.cpu i').style.width=Math.min(100,p.cpuavg*2.2)+'%';
    el.querySelector('.cpuv').textContent='CPU '+p.cpuavg.toFixed(1)+'% · 5MIN';
    let topN='',topC=-1;
    for(const[n,v]of Object.entries(p.live))if(v.running&&v.avg>topC){topC=v.avg;topN=n;}
    el.querySelector('.topc').textContent=topN?('top: '+topN):'';
    el.querySelector('.blist').innerHTML=s.keys.map(k=>{
      const v=p.live[k];
      const cls=!v?'zz':v.bad?'bad':v.running?'ok':(v.dormant?'zz':'bad');
      const mark=!v?'○':v.bad?'✹':v.running?'●':(v.dormant?'◌':'✹');
      const mb=v&&v.running?`<span class="mb">${v.mem.toFixed(0)} MB</span>`:'';
      return `<div>${mb}<span class="${cls}">${mark}</span> ${k}</div>`;
    }).join('');
    el.classList.toggle('alert',p.alerts.length>0);
    el.querySelector('.badge').style.display=p.alerts.length?'':'none';
  }
  SYS=per;
}

async function poll(){
  try{const r=await fetch('telemetry.json',{cache:'no-store'});
      if(r.ok)applyLive(await r.json());}catch(e){}
}
(async()=>{
  try{const r=await fetch('lore.json',{cache:'no-store'});if(r.ok)LORE=await r.json();}catch(e){}
  await poll();setInterval(poll,60000);
})();

/* ---- clock ---- */
setInterval(()=>{document.getElementById('clock').textContent=
  new Date().toLocaleTimeString('pt-BR');},1000);

/* ---- dossier cyclers: each strip owns a slice of the systems, alerts first ---- */
function makeCycler(col){
  const strip=strips[col],dos=strip.querySelector('.dos');
  let items=[],idx=-1;
  function rebuildItems(){
    const mine=SYSTEMS.filter((s,i)=>i%3===col);
    const alerted=mine.filter(s=>SYS[s.id]&&SYS[s.id].alerts.length);
    const pool=alerted.length?alerted:mine;
    items=[];for(const s of pool)for(const k of s.keys)items.push([s,k]);
  }
  return function next(){
    rebuildItems();if(!items.length)return;
    dos.classList.add('fade');
    setTimeout(()=>{
      idx=(idx+1)%items.length;
      const[s,k]=items[idx],p=SYS[s.id]||{live:{},alerts:[]},v=p.live[k];
      for(const ss of SYSTEMS)if(cards[ss.id])cards[ss.id].classList.remove('spot');
      if(cards[s.id])cards[s.id].classList.add('spot');
      const dot=strip.querySelector('.dot');
      dot.style.background=s.color;dot.style.boxShadow=`0 0 14px ${s.color}`;
      dos.querySelector('.nm').innerHTML=`${k}<em>${s.name}</em>`;
      dos.querySelector('.ds').textContent=(v&&v.desc)||'';
      const st=dos.querySelector('.st');
      if(v){
        st.className='st'+(v.bad?' bad':'');
        st.textContent=v.bad?('✹ '+(p.alerts.find(a=>a.startsWith(k))||'ALERT')):
          v.running?`● ${(v.status||'').toLowerCase()} · ${v.mem.toFixed(0)} MB · CPU ${v.cpu.toFixed(1)}% NOW · ${v.avg.toFixed(1)}% 5MIN`:
          v.dormant?'● dormant — wakes on schedule':'● ADRIFT — '+(v.status||'').toLowerCase();
      }else{st.className='st';st.textContent='● no telemetry';}
      dos.classList.remove('fade');
    },600);
  };
}
setTimeout(()=>{
  for(let c=0;c<3;c++){const n=makeCycler(c);n();setInterval(n,8000);}
},1800);
</script>
